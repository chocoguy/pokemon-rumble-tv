# The Apple TV app's Xcode project, generated with xcodegen (tvos/tools/build.sh runs
# it). The game, the port and the Metal backend are static libraries CMake builds into
# build/tvos-sim (simulator) or build/tvos (device); this project adds the app shell
# (platform/tvos) and copies the imported game files (rom/content) into the bundle,
# since tvOS keeps no files of its own.
name: RumbleTV
options:
  deploymentTarget:
    tvOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
targets:
  Rumble:
    type: application
    platform: tvOS
    sources:
      - path: ../platform/tvos
      - path: ../rom/content
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: ImageIO.framework
      - sdk: GameController.framework
    settings:
      base:
        PRODUCT_NAME: Rumble
        PRODUCT_BUNDLE_IDENTIFIER: $(RUMBLE_BUNDLE_ID)
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "3"
        MARKETING_VERSION: "0.3"
        CURRENT_PROJECT_VERSION: "1"
        CLANG_ENABLE_OBJC_ARC: YES
        # (the libraries are arm64 only, the simulator's included)
        ARCHS: arm64
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../port/include
          - $(SRCROOT)/../platform/metal
        CODE_SIGN_STYLE: Automatic
        # (the libraries' folder: build.sh passes RUMBLE_LIBS)
        LIBRARY_SEARCH_PATHS: $(RUMBLE_LIBS)
        OTHER_LDFLAGS:
          - -lrumble_fork
          - -lrumble_port
          - -lrumble_metal
          - -lrumble_stubs
          - -lc++
        # (the game's 1 GB address window is zero-fill data in the executable, which
        # port_mem.c finds through the executable's header: no debug dylib)
        DEAD_CODE_STRIPPING: NO
        ENABLE_DEBUG_DYLIB: NO
